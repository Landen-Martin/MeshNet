<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesh Net</title>
<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<style>
:root{--bg:#101014;--bg2:#1a1a20;--bg3:#242430;--line:#2d2d38;--fg:#eaeaea;--dim:#888;--hi:#ff7b00;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden}
input,textarea,button{font:inherit;outline:none}button{cursor:pointer;border:0;background:none;color:inherit}

.tabs{display:flex;gap:4px;background:#0a0a0e;padding:6px 8px 0;border-bottom:1px solid var(--line)}
.tabs .strip{display:flex;gap:4px;overflow-x:auto;flex:1}
.tab{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 12px;min-width:130px;max-width:200px;background:var(--bg2);border-radius:8px 8px 0 0;color:var(--dim);cursor:pointer;font-size:12px}
.tab.on{background:var(--bg);color:var(--fg);margin-bottom:-1px;padding-bottom:9px}
.tab .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{width:16px;height:16px;border-radius:3px;display:grid;place-items:center;opacity:0;font-size:14px}
.tab:hover .x,.tab.on .x{opacity:1}.tab .x:hover{background:#3a3a48}
.tabs .add{width:30px;align-self:flex-end;padding-bottom:6px;color:var(--dim);font-size:16px}
.tabs .add:hover{color:var(--fg)}

.bar{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center}
.bar .nav{width:32px;height:32px;border-radius:50%;color:var(--dim);font-size:16px;display:grid;place-items:center}
.bar .nav:hover:not(:disabled){background:var(--bg3);color:var(--fg)}
.bar .nav:disabled{opacity:.3;cursor:default}
.bar .url{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:8px 16px;color:var(--fg);font-size:13px}
.bar .url:focus{border-color:var(--hi)}
.bar .go{background:var(--hi);color:#fff;font-weight:600;padding:8px 16px;border-radius:999px;font-size:13px}

.stage{flex:1;min-height:0;display:flex;overflow:hidden}
.stage iframe{flex:1;border:0;background:#fff}

.home{flex:1;display:flex;flex-direction:column;align-items:center;padding:70px 20px 40px;overflow-y:auto}
.home h1{font-size:52px;font-weight:800;letter-spacing:-2px;margin:0 0 6px;background:linear-gradient(135deg,#ff8c42,#ff5e00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.home p{color:var(--dim);margin:0 0 36px}
.home .box{display:flex;width:100%;max-width:520px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 18px}
.home .box:focus-within{border-color:var(--hi)}
.home .box input{flex:1;background:0;border:0;color:var(--fg);font-size:15px}
.home .box button{background:var(--hi);color:#fff;font-weight:600;padding:10px 20px;border-radius:999px}
.home .tip{margin-top:16px;color:var(--dim);font-size:12px}
.home .tip kbd{background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font:inherit;font-size:11px;color:var(--fg);margin:0 2px}
.home .sites{width:100%;max-width:660px;margin-top:40px}
.home .sites h3{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin:0 0 12px}
.home .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.card:hover{border-color:var(--hi)}
.card .h{font-size:11px;color:var(--hi);font-family:ui-monospace,monospace}
.card .n{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .w{font-size:11px;color:var(--dim)}
.none{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px;color:var(--dim);font-size:13px;text-align:center;grid-column:1/-1}
.none b{color:var(--fg)}

.load{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--dim);font-size:13px}
.load .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--hi);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.back{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:100;backdrop-filter:blur(4px)}
.back.on{display:flex}
.dlg{background:var(--bg2);border:1px solid var(--line);border-radius:12px;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column}
.dlg header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.dlg header h2{margin:0;font-size:15px;flex:1}
.dlg header .tag{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:var(--hi);color:#fff;padding:3px 8px;border-radius:4px}
.dlg header .x{width:28px;height:28px;border-radius:6px;color:var(--dim);font-size:18px;display:grid;place-items:center}
.dlg header .x:hover{background:var(--bg3);color:var(--fg)}
.dlg .body{padding:16px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.dlg footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.dlg .stat{flex:1;font-size:12px;color:var(--dim)}
.dlg .stat.ok{color:var(--ok)}.dlg .stat.bad{color:var(--bad)}

.site{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0e0e12}
.site .head{display:flex;gap:6px;align-items:center;padding:8px;background:var(--bg3)}
.site .head input{flex:1;background:#0a0a0e;border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--fg);font-size:12px;font-family:ui-monospace,monospace}
.site .head input:focus{border-color:var(--hi)}
.site .head .rm{padding:6px 10px;border-radius:6px;color:var(--bad);font-size:12px}
.site .head .rm:hover{background:rgba(248,113,113,.1)}
.site .head .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex-shrink:0}
.site .head .dot.on{background:var(--ok)}
.site textarea{width:100%;border:0;background:#0a0a0e;color:var(--fg);padding:10px;font:12px/1.5 ui-monospace,monospace;min-height:120px;resize:vertical;border-top:1px solid var(--line)}

.btn{padding:8px 14px;border-radius:7px;background:var(--bg3);color:var(--fg);font-weight:600;font-size:13px}
.btn:hover{background:#2e2e3a}
.btn.pri{background:var(--hi);color:#fff}.btn.pri:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.add{width:100%;text-align:center;padding:10px;border:1px dashed var(--line);background:0;color:var(--dim);font-weight:500}
.btn.add:hover{border-color:var(--hi);color:var(--hi)}

.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,80px);background:var(--bg3);border:1px solid var(--line);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:200}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="tabs">
  <div class="strip" id="strip"></div>
  <button class="add" id="newTab">+</button>
</div>

<div class="bar">
  <button class="nav" id="back" disabled>&larr;</button>
  <input class="url" id="url" placeholder="LMEPTP:/@host  or just a host name" autocomplete="off" spellcheck="false">
  <button class="go" id="go">Go</button>
</div>

<div class="stage" id="stage"></div>

<div class="back" id="hostModal">
  <div class="dlg">
    <header>
      <span class="tag">HOST</span>
      <h2>Your websites</h2>
      <button class="x" id="closeHost">&times;</button>
    </header>
    <div class="body" id="siteList"></div>
    <footer>
      <div class="stat" id="hostStat">Not hosting</div>
      <button class="btn" id="stopAll" disabled>Stop</button>
      <button class="btn pri" id="startAll">Start</button>
    </footer>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const KNOWN = 'mn_known', SITES = 'mn_sites';

/* ---------- tabs ---------- */
let tabs = [], cur = null, nextId = 1;
const tab = () => tabs.find(t => t.id === cur);

function newTab(url){
  let t = {id: nextId++, view:'home', url:'', html:'', title:'New Tab', gen:0};
  tabs.push(t); cur = t.id;
  paintTabs(); paintStage();
  setTimeout(() => {
    if(url) go(url);
    else { let b = $('bigInput'); if(b) b.focus(); }
  }, 0);
}

function killTab(id){
  let i = tabs.findIndex(t => t.id === id);
  if(i < 0) return;
  tabs.splice(i, 1);
  if(!tabs.length){ newTab(); return; }
  if(cur === id) cur = tabs[Math.max(0, i-1)].id;
  paintTabs(); paintStage();
}

function pickTab(id){
  if(cur === id) return;
  cur = id; paintTabs(); paintStage();
}

function paintTabs(){
  $('strip').innerHTML = tabs.map(t =>
    `<div class="tab${t.id===cur?' on':''}" data-t="${t.id}">
       <span class="t">${esc(t.view==='home' ? 'New Tab' : (t.title||t.url))}</span>
       <button class="x" data-x="${t.id}">&times;</button>
     </div>`).join('');
}

function paintStage(){
  let t = tab(); if(!t) return;
  let stage = $('stage');

  if(t.view === 'page'){
    $('url').value = 'LMEPTP:/@' + t.url;
    $('back').disabled = false;
    stage.innerHTML = '<iframe sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>';
    stage.querySelector('iframe').srcdoc = t.html;
  } else if(t.view === 'load'){
    $('url').value = 'LMEPTP:/@' + t.url;
    $('back').disabled = false;
    stage.innerHTML = `<div class="load"><div class="spin"></div><div>Resolving LMEPTP:/@${esc(t.url)}&hellip;</div></div>`;
  } else {
    $('url').value = '';
    $('back').disabled = true;
    stage.innerHTML = homeHTML();
    setTimeout(() => { let b = $('bigInput'); if(b) b.focus(); }, 0);
  }
}

/* ---------- home page ---------- */
function homeHTML(query, err){
  let known = getKnown();
  let inner;
  if(err){
    inner = `<div class="none">${err}</div>`;
  } else if(!known.length){
    inner = `<div class="none">No sites yet. Type a host name above, or press <b>D&nbsp;E&nbsp;V</b> to host one.</div>`;
  } else {
    inner = known.slice(0, 12).map(k =>
      `<div class="card" data-h="${esc(k.host)}">
         <div class="h">LMEPTP:/@${esc(k.host)}</div>
         <div class="n">${esc(k.title || k.host)}</div>
         <div class="w">${when(k.time)}</div>
       </div>`).join('');
  }
  let head = err ? 'No matches' : (known.length ? 'Recent on the mesh' : 'Get started');
  return `<div class="home">
    <h1>Mesh Net</h1>
    <p>the encrypted peer-to-peer web</p>
    <div class="box">
      <input id="bigInput" placeholder="Search or type LMEPTP:/@host" autocomplete="off" spellcheck="false" value="${esc(query||'')}">
      <button id="bigGo">Search</button>
    </div>
    <div class="tip">press <kbd>D</kbd><kbd>E</kbd><kbd>V</kbd> to host a website</div>
    <div class="sites">
      <h3>${head}</h3>
      <div class="grid">${inner}</div>
    </div>
  </div>`;
}

/* ---------- navigation ---------- */
function hostOf(input){
  let s = (input||'').trim();
  if(!s) return null;
  let m = s.match(/^LMEPTP:\/{0,2}@?(.+)$/i);
  let c = (m ? m[1] : s).toLowerCase().replace(/[^a-z0-9.\-_]/g, '');
  return /[a-z0-9]/.test(c) ? c : null;
}

async function go(input){
  let t = tab(); if(!t) return;
  let myGen = ++t.gen;
  let host = hostOf(input);

  if(!host){
    t.view = 'home'; t.url = ''; t.html = ''; t.title = 'New Tab';
    paintTabs();
    $('stage').innerHTML = homeHTML('', input.trim() ? `No mesh host matches <b>${esc(input.trim())}</b>.` : '');
    $('url').value = ''; $('back').disabled = true;
    setTimeout(() => { let b = $('bigInput'); if(b) b.focus(); }, 0);
    return;
  }

  t.view = 'load'; t.url = host; t.title = host;
  paintTabs(); paintStage();

  try {
    let r = await fetchPage(host);
    if(myGen !== t.gen || !tabs.includes(t)) return;
    t.view = 'page'; t.html = r.html; t.title = r.title;
    remember(host, r.title);
    paintTabs(); paintStage();
  } catch(e){
    if(myGen !== t.gen || !tabs.includes(t)) return;
    t.view = 'home'; t.url = ''; t.html = ''; t.title = 'New Tab';
    paintTabs();
    $('stage').innerHTML = homeHTML('', `Could not reach <b>LMEPTP:/@${esc(host)}</b> &mdash; ${esc(e.message||e)}`);
    $('url').value = ''; $('back').disabled = true;
  }
}

/* ---------- recent sites ---------- */
function getKnown(){
  try {
    let a = JSON.parse(localStorage.getItem(KNOWN)) || [];
    return Array.isArray(a) ? a.filter(x => x && typeof x.host === 'string' && x.host) : [];
  } catch(e){ return []; }
}
function remember(host, title){
  let a = getKnown().filter(x => x.host !== host);
  a.unshift({host, title: title||host, time: Date.now()});
  try { localStorage.setItem(KNOWN, JSON.stringify(a.slice(0, 30))); } catch(e){}
}
function when(ts){
  let d = Date.now() - ts;
  if(d < 60000) return 'just now';
  if(d < 3600000) return Math.floor(d/60000) + 'm ago';
  if(d < 86400000) return Math.floor(d/3600000) + 'h ago';
  return Math.floor(d/86400000) + 'd ago';
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function b64(u8){ let s = ''; for(let i=0;i<u8.length;i++) s += String.fromCharCode(u8[i]); return btoa(s); }
function unb64(s){ let b = atob(s), u = new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i] = b.charCodeAt(i); return u; }

let toastT;
function toast(msg){
  let el = $('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('on'), 1800);
}

/* ---------- crypto ---------- */
async function genKeys(){
  return crypto.subtle.generateKey({name:'ECDH', namedCurve:'P-256'}, true, ['deriveKey']);
}
async function pubOut(k){ return b64(new Uint8Array(await crypto.subtle.exportKey('raw', k))); }
async function pubIn(s){ return crypto.subtle.importKey('raw', unb64(s), {name:'ECDH', namedCurve:'P-256'}, true, []); }
async function shared(priv, pub){
  return crypto.subtle.deriveKey({name:'ECDH', public:pub}, priv,
    {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function seal(key, text){
  let iv = crypto.getRandomValues(new Uint8Array(12));
  let ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(text));
  return {iv: b64(iv), ct: b64(new Uint8Array(ct))};
}
async function unseal(key, iv, ct){
  let pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: unb64(iv)}, key, unb64(ct));
  return new TextDecoder().decode(pt);
}
function peerId(host){ return 'meshnet-' + host.toLowerCase().replace(/[^a-z0-9]/g, '-'); }

/* ---------- client fetch ---------- */
function fetchPage(host){
  if(!window.crypto || !crypto.subtle) return Promise.reject(new Error('Encryption needs HTTPS'));
  let pid = peerId(host);

  return genKeys().then(myKeys => new Promise((res, rej) => {
    let peer;
    try { peer = new Peer({debug:0}); }
    catch(e){ rej(new Error('Network unavailable')); return; }

    let done = false;
    let timer = setTimeout(() => finish(rej, new Error('Timed out')), 15000);

    function finish(fn, v){
      if(done) return; done = true;
      clearTimeout(timer);
      try { peer.destroy(); } catch(e){}
      fn(v);
    }

    peer.on('open', () => {
      let conn = peer.connect(pid, {reliable:true});
      let sk = null;

      conn.on('open', async () => {
        try { conn.send({t:'k', p: await pubOut(myKeys.publicKey)}); }
        catch(e){ finish(rej, e); }
      });

      conn.on('data', async m => {
        try {
          if(m.t === 'k' && !sk){
            sk = await shared(myKeys.privateKey, await pubIn(m.p));
            conn.send({t:'q'});
          } else if(m.t === 'r' && sk){
            let text = await unseal(sk, m.iv, m.ct);
            let data = JSON.parse(text);
            let mt = data.body.match(/<title[^>]*>([^<]*)<\/title>/i);
            finish(res, {html: data.body, title: mt ? mt[1].trim() : host});
          }
        } catch(e){ finish(rej, e); }
      });

      conn.on('error', () => finish(rej, new Error('Connection failed')));
    });

    peer.on('error', e => {
      let t = e && e.type;
      let msg = t === 'peer-unavailable' ? 'Host not found'
              : t === 'network' ? 'Network unavailable'
              : t || 'Network error';
      finish(rej, new Error(msg));
    });
  }));
}

/* ---------- host: many sites ---------- */
let sites = [];

function starter(){
  return `<!doctype html>
<html><head><meta charset="utf-8"><title>Hello from Mesh Net</title>
<style>body{font:16px/1.7 system-ui;background:#101014;color:#eaeaea;max-width:560px;margin:40px auto;padding:0 24px}
h1{color:#ff7b00;font-size:26px;margin:0 0 4px}
.tag{display:inline-block;background:#1a1a20;color:#4ade80;padding:3px 10px;border-radius:999px;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px}
code{background:#1a1a20;padding:2px 6px;border-radius:4px;color:#ff7b00}
hr{border:0;border-top:1px solid #2d2d38;margin:24px 0}
.dim{color:#888;font-size:13px}</style></head>
<body>
<span class="tag">mesh net</span>
<h1>Hello from Mesh Net</h1>
<p>This page came from another peer over <b>LMEPTP</b> &mdash; an encrypted peer-to-peer protocol. No server, no login, no CDN.</p>
<p>Key exchange: <code>ECDH P-256</code> &middot; Payload: <code>AES-GCM 256</code></p>
<hr>
<p class="dim">Press D E V on the host side to edit this and add more sites.</p>
</body></html>`;
}

function loadSites(){
  try {
    let a = JSON.parse(localStorage.getItem(SITES)) || [];
    if(Array.isArray(a) && a.length) return a.map(s => ({name: s.name||'', html: s.html||starter()}));
  } catch(e){}
  return [{name:'welcome.mesh', html: starter()}];
}

function saveSites(){
  try {
    localStorage.setItem(SITES, JSON.stringify(sites.map(s => ({name:s.name, html:s.html}))));
  } catch(e){}
}

function drawSites(){
  $('siteList').innerHTML = sites.map((s, i) =>
    `<div class="site">
       <div class="head">
         <span class="dot${s.peer?' on':''}"></span>
         <input data-name="${i}" placeholder="host.name" value="${esc(s.name)}" spellcheck="false">
         <button class="rm" data-rm="${i}">remove</button>
       </div>
       <textarea data-html="${i}" spellcheck="false">${esc(s.html)}</textarea>
     </div>`).join('')
    + `<button class="btn add" id="addSite">+ add another website</button>`;
}

$('siteList').addEventListener('input', e => {
  let n = e.target.dataset.name, h = e.target.dataset.html;
  if(n != null) sites[+n].name = e.target.value;
  if(h != null) sites[+h].html = e.target.value;
  saveSites();
});

$('siteList').addEventListener('click', e => {
  if(e.target.id === 'addSite'){
    sites.push({name:'', html: starter()});
    saveSites(); drawSites();
    return;
  }
  let r = e.target.dataset.rm;
  if(r != null){
    stopSite(sites[+r]);
    sites.splice(+r, 1);
    if(!sites.length) sites.push({name:'', html: starter()});
    saveSites(); drawSites();
  }
});

async function startAll(){
  let stat = $('hostStat');
  stat.textContent = 'Starting...'; stat.className = 'stat';
  $('startAll').disabled = true;
  $('stopAll').disabled = false;

  let ok = 0, fail = 0;
  for(let s of sites){
    let name = s.name.trim().toLowerCase();
    if(!name || !/^[a-z0-9.\-_]+$/.test(name)){ fail++; continue; }
    try { await startSite(s, name); ok++; }
    catch(e){ fail++; }
  }

  drawSites();
  if(ok){
    stat.textContent = `Serving ${ok} site${ok===1?'':'s'}${fail?` (${fail} skipped)`:''}`;
    stat.className = 'stat ok';
  } else {
    stat.textContent = 'Nothing to serve — check host names';
    stat.className = 'stat bad';
    $('startAll').disabled = false;
    $('stopAll').disabled = true;
  }
}

function startSite(s, name){
  return new Promise((res, rej) => {
    (async () => {
      let keys = await genKeys();
      await new Promise(r => setTimeout(r, 120));  // let a stale peer ID release

      let peer;
      try { peer = new Peer(peerId(name), {debug:0}); }
      catch(e){ rej(e); return; }

      let done = false;
      let t = setTimeout(() => {
        if(done) return;
        done = true;
        try { peer.destroy(); } catch(e){}
        rej(new Error('timeout'));
      }, 8000);

      peer.on('open', () => {
        if(done) return;
        done = true; clearTimeout(t);
        s.peer = peer; s.key = keys; s.id = peerId(name);
        res();
      });

      peer.on('connection', c => attach(s, c, keys));

      peer.on('error', e => {
        if(done) return;
        done = true; clearTimeout(t);
        try { peer.destroy(); } catch(_){}
        rej(e);
      });
    })().catch(rej);
  });
}

function attach(s, conn, keys){
  let sk = null;
  conn.on('data', async m => {
    try {
      if(m.t === 'k' && !sk){
        sk = await shared(keys.privateKey, await pubIn(m.p));
        conn.send({t:'k', p: await pubOut(keys.publicKey)});
      } else if(m.t === 'q' && sk){
        let pkt = JSON.stringify({body: s.html || ''});
        let enc = await seal(sk, pkt);
        conn.send({t:'r', iv:enc.iv, ct:enc.ct});
      }
    } catch(e){ /* a bad client shouldn't take down the host */ }
  });
}

function stopSite(s){
  if(s.peer){ try { s.peer.destroy(); } catch(e){} s.peer = null; }
  s.key = null; s.id = null;
}

function stopAll(){
  sites.forEach(stopSite);
  drawSites();
  $('hostStat').textContent = 'Not hosting';
  $('hostStat').className = 'stat';
  $('startAll').disabled = false;
  $('stopAll').disabled = true;
}

function openHost(){ $('hostModal').classList.add('on'); }
function closeHost(){ $('hostModal').classList.remove('on'); }

/* ---------- wiring ---------- */
$('strip').addEventListener('click', e => {
  let x = e.target.closest('[data-x]');
  if(x){ e.stopPropagation(); killTab(+x.dataset.x); return; }
  let t = e.target.closest('[data-t]');
  if(t) pickTab(+t.dataset.t);
});

$('stage').addEventListener('click', e => {
  let c = e.target.closest('.card');
  if(c){ go(c.dataset.h); return; }
  if(e.target.id === 'bigGo'){
    let b = $('bigInput');
    go(b ? b.value : '');
  }
});

$('stage').addEventListener('keydown', e => {
  if(e.target.id === 'bigInput' && e.key === 'Enter'){
    e.preventDefault();
    go(e.target.value);
  }
});

$('newTab').onclick = () => newTab();
$('go').onclick = () => go($('url').value);
$('back').onclick = () => {
  let t = tab();
  if(!t || t.view === 'home') return;
  t.view = 'home'; t.url = ''; t.html = ''; t.title = 'New Tab'; t.gen++;
  paintTabs(); paintStage();
};
$('url').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); go(e.target.value); }
});

$('closeHost').onclick = closeHost;
$('hostModal').onclick = e => { if(e.target === $('hostModal')) closeHost(); };
$('startAll').onclick = startAll;
$('stopAll').onclick = stopAll;

/* D E V opens the host panel */
let buf = [], bufT;
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && $('hostModal').classList.contains('on')){ closeHost(); return; }
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  buf.push(e.key.toLowerCase());
  if(buf.length > 3) buf.shift();
  clearTimeout(bufT);
  bufT = setTimeout(() => { buf = []; }, 900);

  if(buf.join('') === 'dev'){ buf = []; openHost(); }
});

document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 't'){
    e.preventDefault(); newTab();
  }
});

/* ---------- boot ---------- */
sites = loadSites();
drawSites();
newTab();
</script>
</body>
</html>
